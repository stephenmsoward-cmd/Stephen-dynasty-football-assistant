name: Refresh dynasty reports

# Schedule + on-push + manual triggers.
on:
  schedule:
    # 09:30 UTC daily ≈ 04:30 ET / 02:30 PT — after FantasyCalc's overnight refresh.
    - cron: "30 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "leagues.yml"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      # Cache API responses across runs. TTLs in data.py (24h) handle staleness.
      # Daily key means a fresh cache after midnight UTC, ensuring data is current
      # by the time the 09:30 UTC schedule fires.
      - name: Cache API responses
        uses: actions/cache@v4
        with:
          path: cache
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            api-cache-${{ runner.os }}-

      - name: Build docs
        run: python pipeline/generate.py

      - name: Commit history + docs updates
        # Pages is configured to deploy from main branch /docs, so this commit
        # IS the deploy. No separate upload-artifact / deploy-pages steps needed.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs history
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh reports ($(date -u +%Y-%m-%d))"
            git push
          fi
