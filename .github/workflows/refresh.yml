name: Refresh dynasty reports

on:
  schedule:
    # 09:30 UTC daily ≈ 04:30 ET / 02:30 PT — after FantasyCalc's overnight refresh.
    - cron: "30 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "leagues.yml"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      # Cache API responses across runs. TTLs in data.py (24h) handle staleness.
      # Daily key means a fresh cache after midnight UTC, ensuring data is current
      # by the time the 09:30 UTC schedule fires.
      - name: Cache API responses
        uses: actions/cache@v4
        with:
          path: cache
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            api-cache-${{ runner.os }}-

      - name: Build site
        run: python pipeline/generate.py

      - name: Commit history + site updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site history
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh reports ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
