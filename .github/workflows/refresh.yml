name: Refresh dynasty reports

# Schedule + on-push + manual triggers.
on:
  schedule:
    # 09:30 UTC daily ≈ 04:30 ET / 02:30 PT — after FantasyCalc's overnight refresh.
    - cron: "30 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "leagues.yml"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  # This job rebuilds the full state from scratch, so an in-flight run is
  # always superseded by a newer one — cancel it to avoid redundant runs
  # racing each other on the commit/push step.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      # Cache API responses across runs. TTLs in data.py (24h) handle staleness.
      # Daily key means a fresh cache after midnight UTC, ensuring data is current
      # by the time the 09:30 UTC schedule fires.
      - name: Cache API responses
        uses: actions/cache@v4
        with:
          path: cache
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            api-cache-${{ runner.os }}-

      - name: Build docs
        run: python pipeline/generate.py

      - name: Commit history + docs updates
        # Pages is configured to deploy from main branch /docs, so this commit
        # IS the deploy. No separate upload-artifact / deploy-pages steps needed.
        #
        # Resilient push: concurrent runs (and manual pushes) can move `main`
        # between our checkout and push, causing a non-fast-forward rejection.
        # We rebase onto the latest main before each push attempt, preferring
        # our freshly-built files on conflict (-X theirs = the commits being
        # replayed = this run's build), and retry a few times.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs history
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh reports ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt hit a race; retrying in 5s..."
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
